# MySQL Configuration Profile
datasources:
  default:
    url: jdbc:mysql://localhost:3306/petclinic
    username: petclinic
    password: petclinic
    driver-class-name: com.mysql.cj.jdbc.Driver
    dialect: MYSQL
    # Include shared entities only; exclude Oracle-only JSON duality views.
    packages:
      - io.micronaut.samples.petclinic.model
