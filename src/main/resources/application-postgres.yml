# PostgreSQL Configuration Profile
datasources:
  default:
    url: jdbc:postgresql://localhost:5432/petclinic
    username: petclinic
    password: petclinic
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    # Include shared entities only; exclude Oracle-only JSON duality views.
    packages:
      - io.micronaut.samples.petclinic.model
