micronaut:
  server:
    port: -1
  application:
    name: micronaut-petclinic-test
  views:
    jte:
      dynamic: false

# Enable sample data for tests
petclinic:
  sample-data:
    enabled: true

endpoints:
  info:
    sensitive: false
  health:
    details-visible: authenticated
    jdbc:
      enabled: true

info:
  application:
    name: ${micronaut.application.name}
